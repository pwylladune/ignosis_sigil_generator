name: ignosis_sigil_generator
description: "IGNOSIS: a chaos-magic sigil studio with seven sigil systems, Gnosis breathing and a ritual burn (iOS, Android, web)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  share_plus: ^11.0.0
  printing: ^5.15.1
  pdf: ^3.13.1
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  http: ^1.6.0
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/compendium/compendium.json
  shaders:
    - assets/shaders/combustion.frag
