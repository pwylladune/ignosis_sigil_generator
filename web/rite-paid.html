<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IGNOSIS · Payment</title>
  <style>
    :root { --paper: #F7F5F0; --ink: #141416; --muted: #6B6B73; --seal: #C0392B; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #111113; --ink: #ECECEE; --muted: #9A9AA3; --seal: #E5484D; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper); color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 0 16px;
    }
    main { max-width: 26rem; text-align: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--seal); margin: 0 auto 20px; }
    h1 { font-size: 13px; letter-spacing: 0.15em; margin: 0 0 10px; }
    p { color: var(--muted); margin: 0 0 8px; }
    button {
      margin-top: 16px; min-height: 44px; padding: 0 20px; border-radius: 8px;
      border: 1px solid var(--ink); background: transparent; color: var(--ink);
      font: bold 12px/1 inherit; letter-spacing: 0.08em; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1 id="title">PAYMENT RECEIVED</h1>
    <p id="body">Return to the IGNOSIS tab. Your release will be burnt on-chain as its witness.</p>
    <button type="button" onclick="window.close()">CLOSE THIS TAB</button>
  </main>
  <script>
    if (new URLSearchParams(location.search).has('cancelled')) {
      document.getElementById('title').textContent = 'CHECKOUT CANCELLED';
      document.getElementById('body').textContent = 'Nothing was charged. Return to the IGNOSIS tab; the rite works without the on-chain witness.';
    }
  </script>
</body>
</html>
