<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chaos-magic sigil studio: seven sigil systems, Gnosis breathing and a ritual burn.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IGNOSIS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#F4F4F0">

  <title>IGNOSIS</title>
  <link rel="manifest" href="manifest.json">
  <!-- The page is paper from the first paint; the mark holds the place of
       the studio until Flutter draws its first frame. -->
  <style>
    html, body { height: 100%; margin: 0; background: #F4F4F0; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
      font: 500 12px/1 -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
      letter-spacing: 0.2em; color: #141416;
    }
    #splash i { width: 8px; height: 8px; border-radius: 50%; background: #C0392B; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><i></i>IGNOSIS</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
