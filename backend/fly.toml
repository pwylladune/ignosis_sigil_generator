# Fly.io: the rite backend (ADR 2026-10-25-ignosis-joule-token).
#
# Exactly one machine. The fulfilment ledger is a SQLite file on the volume,
# and two machines would mean two ledgers, which could burn twice for one
# purchase. Deploy with `fly deploy --ha=false`; never scale above 1.
# The machine never stops: the sweeper and the Play refund check run in it.
#
# Mainnet (ADR 2026-10-27-ignosis-treasury-cold-owner-hot-delegate). The
# Joules belong to the cold TREASURY_OWNER; the server key burns as its
# delegate within the allowance the owner approves.
#
# Secrets (fly secrets set / import):
#   TREASURY_PRIVATE_KEY  the server key (the delegate), never the owner's
#   SOLANA_RPC_URL        a mainnet RPC with its API key (Helius)
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_RITE_PRICES  live mode
#   GOOGLE_PLAY_SERVICE_ACCOUNT  when Android rites are ready
# Each fails closed: without a mainnet RPC rites refuse to burn (the default
# RPC is devnet), and a test Stripe key turns web payment off on mainnet.

app = "ignosis-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SOLANA_CLUSTER = "mainnet-beta"
  JOULE_MINT_ADDRESS = "HoDanvE1TVJQfBxt8jWbPQM4a5HPamtjDm5KNPo8V5Sj"
  TREASURY_OWNER = "B94KMTKhdJugAwdugDKRRPNpK3jnShq9Sjq6irwJZhwb"
  # A fresh ledger: the devnet one (rite-ledger.sqlite) holds test credits.
  RITE_LEDGER_PATH = "/data/rite-ledger-mainnet.sqlite"
  # Fly's edge proxy appends the client's address to X-Forwarded-For.
  TRUST_PROXY_HOPS = "1"
  # The production web app only.
  CORS_ORIGINS = "https://ignosis.net,https://www.ignosis.net"
  WEB_ORIGIN = "https://ignosis.net"

[[mounts]]
  source = "rite_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
