# Fails (and so emails the repository owner) when the rite server could soon
# stop burning: the delegate allowance or the server's SOL is running low, or
# the delegate is no longer the server key. Read-only and keyless: it reads
# the public chain with public addresses.
#
# Setup: set the repository variable RITE_DELEGATE to the server's public key.
# Optional secret SOLANA_RPC_URL (a mainnet RPC); the public endpoint is used
# without it. Scheduled runs only start once this file is on the default branch.
name: Treasury watch

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
      # Public addresses, as in backend/fly.toml.
      JOULE_MINT_ADDRESS: HoDanvE1TVJQfBxt8jWbPQM4a5HPamtjDm5KNPo8V5Sj
      TREASURY_OWNER: B94KMTKhdJugAwdugDKRRPNpK3jnShq9Sjq6irwJZhwb
      RITE_DELEGATE: ${{ vars.RITE_DELEGATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node dist/tools/treasuryStatus.js --check
